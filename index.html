<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earthview from the Moon</title>
  <meta name="description"
    content="An interactive 2D visualizer showing what the Earth looks like from the surface of the Moon, with time-lapse animation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="scene"></canvas>

  <div id="controls">
    <div class="control-group">
      <label for="location-select" class="control-label">🌙 Location on the Moon</label>
      <div class="select-wrapper">
        <select id="location-select">
          <option value="tranquility">Sea of Tranquility</option>
          <option value="procellarum">Oceanus Procellarum</option>
          <option value="southpole">Lunar South Pole</option>
          <option value="farside">Far Side — Mare Moscoviense</option>
        </select>
      </div>
    </div>

    <div class="control-group date-group">
      <label class="control-label">🕐 Mission Window</label>
      <div class="date-row">
        <div class="date-field">
          <label for="start-date" class="date-label">Start</label>
          <input type="date" id="start-date">
        </div>
        <div class="date-field">
          <label for="end-date" class="date-label">End</label>
          <input type="date" id="end-date">
        </div>
      </div>
    </div>

    <div class="control-group action-group">
      <button id="play-btn" type="button">▶ Play Time-Lapse</button>
      <div class="speed-row">
        <label for="speed-select" class="speed-label">Speed</label>
        <div class="select-wrapper">
          <select id="speed-select">
            <option value="1">1×</option>
            <option value="5">5×</option>
            <option value="10" selected>10×</option>
            <option value="30">30×</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
