
<!DOCTYPE html>
<html>
<head>
<style>
  #error-log { position: fixed; top: 0; left: 0; background: red; color: white; z-index: 9999; padding: 20px; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="error-log"></div>
<script>
  window.onerror = function(msg, url, line, col, error) {
      document.getElementById('error-log').innerText += msg + '
' + (error ? error.stack : '');
  };
</script>
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earthview from the Moon</title>
  <meta name="description"
    content="An interactive 2D visualizer showing what the Earth looks like from the surface of the Moon, with time-lapse animation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="scene"></canvas>

  <div id="stats-panel">
    <div class="stat-row"><span class="stat-label">Date:</span> <span id="stat-date">--</span></div>
    <div class="stat-row"><span class="stat-label">Phase:</span> <span id="stat-phase">--</span></div>
    <div class="stat-row"><span class="stat-label">Illumination:</span> <span id="stat-illum">-</span></div>
    <div class="stat-row"><span class="stat-label">Libration:</span> <span id="stat-libration">X: 0.0° Y: 0.0°</span>
    </div>
  </div>

  <div id="controls">
    <div class="control-group">
      <label for="location-select" class="control-label">🌙 Location on the Moon</label>
      <div class="select-wrapper">
        <select id="location-select">
          <option value="tranquility">Sea of Tranquility</option>
          <option value="procellarum">Oceanus Procellarum</option>
          <option value="southpole">Lunar South Pole</option>
          <option value="farside">Far Side — Mare Moscoviense</option>
        </select>
      </div>
    </div>

    <div class="control-group date-group">
      <label class="control-label">🕐 Mission Window</label>
      <div class="date-row">
        <div class="date-field">
          <label for="start-date" class="date-label">Start</label>
          <input type="date" id="start-date">
        </div>
        <div class="date-field">
          <label for="end-date" class="date-label">End</label>
          <input type="date" id="end-date">
        </div>
      </div>
    </div>

    <div class="control-group action-group">
      <button id="play-btn" type="button">▶ Play Time-Lapse</button>
      <div class="speed-row">
        <label for="speed-select" class="speed-label">Speed</label>
        <div class="select-wrapper">
          <select id="speed-select">
            <option value="1" selected>1×</option>
            <option value="5">5×</option>
            <option value="10">10×</option>
            <option value="30">30×</option>
          </select>
        </div>
      </div>
    </div>

    <div class="control-group slider-group">
      <input type="range" id="timeline-slider" min="0" max="1000" value="0">
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
</body>
</html>
